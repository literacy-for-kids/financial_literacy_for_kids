<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Financial Literacy for Kids Logo</title>
  <desc id="desc">A compact gold financial literacy icon with a coin stack, wallet, and simple growth arrow.</desc>

  <!-- Background badge -->
  <rect x="12" y="12" width="176" height="176" rx="42" fill="#FFFBEB"/>
  <rect x="12" y="12" width="176" height="176" rx="42" stroke="#CA8A04" stroke-width="8"/>

  <!-- Wallet body -->
  <path d="M50 76
           C50 67 57 60 66 60
           H132
           C142 60 150 68 150 78
           V137
           C150 147 142 155 132 155
           H68
           C58 155 50 147 50 137
           V76Z"
        fill="#CA8A04"/>

  <!-- Wallet front panel -->
  <path d="M50 92H150V137C150 147 142 155 132 155H68C58 155 50 147 50 137V92Z"
        fill="#EAB308"/>

  <!-- Wallet clasp -->
  <rect x="113" y="104" width="30" height="26" rx="13" fill="#FFFBEB"/>
  <circle cx="126" cy="117" r="5" fill="#CA8A04"/>

  <!-- Coin stack -->
  <ellipse cx="82" cy="69" rx="26" ry="10" fill="#FACC15" stroke="#CA8A04" stroke-width="5"/>
  <path d="M56 69V91C56 97 68 102 82 102C96 102 108 97 108 91V69"
        fill="#FACC15"/>
  <path d="M56 80C56 86 68 91 82 91C96 91 108 86 108 80"
        stroke="#CA8A04" stroke-width="5" stroke-linecap="round"/>
  <path d="M56 91C56 97 68 102 82 102C96 102 108 97 108 91"
        stroke="#CA8A04" stroke-width="5" stroke-linecap="round"/>
  <path d="M56 69V91C56 97 68 102 82 102C96 102 108 97 108 91V69"
        stroke="#CA8A04" stroke-width="5" stroke-linejoin="round"/>

  <!-- Dollar mark -->
  <path d="M82 55V83" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M91 60C86 56 75 56 74 63C73 69 91 68 90 76C89 84 77 85 71 80"
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Growth arrow -->
  <path d="M78 133L99 119L113 127L135 104"
        stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M122 103H136V117"
        stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small value dots -->
  <circle cx="58" cy="46" r="6" fill="#FACC15"/>
  <circle cx="143" cy="52" r="6" fill="#FACC15"/>
  <circle cx="158" cy="151" r="6" fill="#FACC15"/>
</svg>
