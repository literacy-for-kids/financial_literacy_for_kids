<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bptTitle">
  <title id="bptTitle">A price timeline for the same loaf of bread: about fifty cents in the 1980s, a dollar fifty in the 2000s, and four dollars today</title>
  <rect x="1" y="1" width="718" height="298" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="360" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Same Bread, Different Price</text>

  <!-- timeline -->
  <line x1="90" y1="190" x2="630" y2="190" stroke="#ca8a04" stroke-width="3.5"/>

  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <!-- 1980s -->
    <g>
      <g transform="translate(150 130)">
        <path d="M-32 14 Q-32 -12 0 -12 Q32 -12 32 14 L32 22 Q32 26 28 26 L-28 26 Q-32 26 -32 22 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
        <path d="M-18 -4 Q-14 2 -10 -4 M-4 -4 Q0 2 4 -4 M10 -4 Q14 2 18 -4" stroke="#b45309" stroke-width="1.8" fill="none"/>
      </g>
      <circle cx="150" cy="190" r="7" fill="#ca8a04"/>
      <text x="150" y="222" font-size="15" font-weight="700" fill="#1e293b">1980s</text>
      <text x="150" y="248" font-size="17" font-weight="700" fill="#16a34a">$0.50</text>
    </g>
    <!-- 2000s -->
    <g>
      <g transform="translate(360 130)">
        <path d="M-32 14 Q-32 -12 0 -12 Q32 -12 32 14 L32 22 Q32 26 28 26 L-28 26 Q-32 26 -32 22 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
        <path d="M-18 -4 Q-14 2 -10 -4 M-4 -4 Q0 2 4 -4 M10 -4 Q14 2 18 -4" stroke="#b45309" stroke-width="1.8" fill="none"/>
      </g>
      <circle cx="360" cy="190" r="7" fill="#ca8a04"/>
      <text x="360" y="222" font-size="15" font-weight="700" fill="#1e293b">2000s</text>
      <text x="360" y="250" font-size="20" font-weight="700" fill="#ca8a04">$1.50</text>
    </g>
    <!-- Today -->
    <g>
      <g transform="translate(570 130)">
        <path d="M-32 14 Q-32 -12 0 -12 Q32 -12 32 14 L32 22 Q32 26 28 26 L-28 26 Q-32 26 -32 22 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
        <path d="M-18 -4 Q-14 2 -10 -4 M-4 -4 Q0 2 4 -4 M10 -4 Q14 2 18 -4" stroke="#b45309" stroke-width="1.8" fill="none"/>
      </g>
      <circle cx="570" cy="190" r="7" fill="#ca8a04"/>
      <text x="570" y="222" font-size="15" font-weight="700" fill="#1e293b">Today</text>
      <text x="570" y="254" font-size="24" font-weight="800" fill="#b91c1c">$4.00</text>
    </g>
  </g>

  <text x="360" y="284" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#64748b">The bread didn't change — the price did. (Prices are rounded examples.)</text>
</svg>
