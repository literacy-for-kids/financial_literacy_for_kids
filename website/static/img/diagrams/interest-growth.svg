<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="igTitle">
  <title id="igTitle">Chart comparing two savers over six rounds: flat interest adds the same amount each round, while percentage interest grows faster and faster because the interest itself starts earning interest</title>
  <rect x="1" y="1" width="858" height="478" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Money Growing Over Time</text>
  <text x="430" y="66" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Both savers start with $10. Watch what happens over six rounds.</text>

  <!-- axes -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="90" y1="390" x2="800" y2="390"/>
    <line x1="90" y1="390" x2="90" y2="90"/>
  </g>
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">
    <text x="150" y="412">start</text>
    <text x="260" y="412">round 1</text>
    <text x="370" y="412">round 2</text>
    <text x="480" y="412">round 3</text>
    <text x="590" y="412">round 4</text>
    <text x="700" y="412">round 5</text>
    <text x="445" y="440">each round, interest is paid</text>
  </g>
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#64748b" text-anchor="end">
    <text x="82" y="394">$10</text>
    <text x="82" y="315">$12</text>
    <text x="82" y="240">$14</text>
    <text x="82" y="165">$16</text>
    <text x="82" y="95">$18</text>
  </g>
  <g stroke="#f1f5f9" stroke-width="1.5">
    <line x1="90" y1="311" x2="800" y2="311"/>
    <line x1="90" y1="236" x2="800" y2="236"/>
    <line x1="90" y1="161" x2="800" y2="161"/>
    <line x1="90" y1="91" x2="800" y2="91"/>
  </g>

  <!-- flat interest: +$1 per round: 10,11,12,13,14,15 → y = 390 - (v-10)*37.5 -->
  <polyline points="150,390 260,352.5 370,315 480,277.5 590,240 700,202.5" fill="none" stroke="#94a3b8" stroke-width="3.5"/>
  <g fill="#94a3b8">
    <circle cx="150" cy="390" r="6"/><circle cx="260" cy="352.5" r="6"/><circle cx="370" cy="315" r="6"/><circle cx="480" cy="277.5" r="6"/><circle cx="590" cy="240" r="6"/><circle cx="700" cy="202.5" r="6"/>
  </g>

  <!-- compound 10%: 10, 11, 12.1, 13.31, 14.64, 16.11 → y = 390 - (v-10)*37.5 -->
  <polyline points="150,390 260,352.5 370,311.3 480,265.9 590,216 700,160.9" fill="none" stroke="#ca8a04" stroke-width="4"/>
  <g fill="#ca8a04">
    <circle cx="150" cy="390" r="6"/><circle cx="260" cy="352.5" r="6"/><circle cx="370" cy="311.3" r="6"/><circle cx="480" cy="265.9" r="6"/><circle cx="590" cy="216" r="6"/><circle cx="700" cy="160.9" r="6"/>
  </g>

  <!-- legend -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="14">
    <line x1="150" y1="120" x2="185" y2="120" stroke="#ca8a04" stroke-width="4"/>
    <text x="195" y="125" fill="#1e293b"><tspan font-weight="700" fill="#a16207">10% interest</tspan> &#8212; the interest itself starts earning interest</text>
    <line x1="150" y1="150" x2="185" y2="150" stroke="#94a3b8" stroke-width="4"/>
    <text x="195" y="155" fill="#1e293b"><tspan font-weight="700" fill="#64748b">flat $1 each round</tspan> &#8212; same amount every time</text>
  </g>

  <!-- callout -->
  <text x="757" y="165" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#a16207">the gap keeps</text>
  <text x="757" y="182" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#a16207">growing!</text>
</svg>
